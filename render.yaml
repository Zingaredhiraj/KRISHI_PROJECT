# Render.com deployment for the Digital Krishi FastAPI backend.
# Vercel hosts the Next.js frontend (set Root Directory to "frontend").

services:
  - type: web
    name: digital-krishi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_DEMO_OTP
        value: "false"
      - key: ENABLE_STARTUP_SCRAPER
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
